<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FIRMMIT</title>
<!-- 외부 요청 0건: 글꼴·이미지·스크립트 전부 로컬. 외부 CDN·분석 스크립트 없음. -->
<!-- 틀 안 삽입 금지 규칙은 meta 로는 적용되지 않는다(브라우저가 무시) → public/_headers 에서 헤더로 준다 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 승인 전 묶음이면 계속 보이는 표시 (G10) -->
  <p class="sample-badge" id="sample-badge" hidden></p>

  <main class="stage" id="stage" aria-live="off">
    <section class="slide" id="slide" aria-label="발표 화면"></section>
  </main>

  <div class="chrome" id="chrome">
    <img class="logo" src="logo.svg" alt="FIRMMIT" width="150" height="34">
    <div class="progress" id="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    <p class="pager" id="pager"></p>
  </div>

  <!-- 목차 (Home 키) -->
  <div class="index-overlay" id="index-overlay" hidden>
    <h2 id="index-title">목차</h2>
    <ol class="index-list" id="index-list"></ol>
    <p class="hint" id="index-hint"></p>
  </div>

  <!-- 조작 안내 (처음 몇 초만) -->
  <p class="keyhint" id="keyhint"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
